# This code has been fully generated by an AI.
#
# Publishes add-on images to GHCR when a tag vX.Y.Z is pushed, then moves the
# branch "stable" to the tag.
#
# Home Assistant reads my_velo/config.yaml from the branch configured in the
# repository URL and immediately offers that version. It therefore subscribes
# to https://github.com/stefanluchs/my-velo#stable: "stable" only advances
# after all images exist, so Home Assistant never offers a version whose image
# is still being built.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write

jobs:
  verify-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        name: Tag must match my_velo/config.yaml
        run: |
          tag="${GITHUB_REF_NAME#v}"
          addon="$(sed -n 's/^version: *"\{0,1\}\([^"]*\)"\{0,1\}$/\1/p' my_velo/config.yaml)"
          if [ "$tag" != "$addon" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match add-on version $addon"
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"

  publish:
    runs-on: ubuntu-latest
    needs: verify-version
    strategy:
      matrix:
        include:
          - arch: aarch64
            platform: linux/arm64
          - arch: amd64
            platform: linux/amd64
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          build-args: VERSION=${{ needs.verify-version.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/my-velo-${{ matrix.arch }}:${{ needs.verify-version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/my-velo-${{ matrix.arch }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

  promote:
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Move branch stable to the released tag
        # Force is intended: stable always points at the latest release, also
        # when a fix release is cut from an older commit.
        run: git push --force origin "${GITHUB_SHA}:refs/heads/stable"
