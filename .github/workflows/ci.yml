# This code has been fully generated by an AI.
#
# Checks for every push and pull request: Go tests and an image build.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race ./...

  image:
    runs-on: ubuntu-latest
    needs: go
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build aarch64 image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: false
          build-args: VERSION=ci
