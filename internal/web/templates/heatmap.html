<!-- This code has been fully generated by an AI. -->
{{define "head"}}
  <link rel="stylesheet" href="static/vendor/maplibre-gl-6.15.0/maplibre-gl.css">
{{end}}
{{define "mainClass"}}full{{end}}

{{define "content"}}{{with .Data}}
<div class="heatmap-layout">
  <form id="heatmap-filter" class="heatmap-panel" aria-label="Heatmap-Filter">
    <h1>Heatmap</h1>
    <p id="heatmap-info" class="hint">Tracks werden geladen …</p>

    <fieldset>
      <legend>Sport</legend>
      {{range .Categories}}
      <label><input type="checkbox" name="cat" value="{{.ID}}" checked> {{.Icon}} {{.Label}}</label>
      {{end}}
    </fieldset>

    <fieldset>
      <legend>Zeitraum</legend>
      <select name="period" aria-label="Zeitraum">
        <option value="all">Gesamter Zeitraum</option>
        <option value="12m">Letzte 12 Monate</option>
        {{range .Years}}<option value="{{.}}">{{.}}</option>{{end}}
        <option value="custom">Eigener Zeitraum …</option>
      </select>
      <div class="custom-range" hidden>
        <label>von <input type="date" name="from"></label>
        <label>bis <input type="date" name="to"></label>
      </div>
    </fieldset>

    <fieldset>
      <legend>Darstellung</legend>
      <label><input type="radio" name="color" value="heat" checked> Heatmap (eine Farbe)</label>
      <label><input type="radio" name="color" value="category"> Farbe nach Sport</label>
      <label><input type="checkbox" name="dim" checked> Karte abdunkeln</label>
    </fieldset>

    <p><button type="button" data-action="fit">Auf Auswahl zoomen</button></p>
    <p class="hint">Klick auf einen Track zeigt die Aktivitäten an dieser Stelle.</p>
  </form>
  <div id="map" class="map heatmap-map" aria-label="Heatmap"></div>
</div>

<script type="application/json" id="map-config">{{.MapConfig.JSON}}</script>
<script type="application/json" id="categories">{{categoriesJSON .Categories}}</script>
<script type="module">
  import { showHeatmap } from "./static/heatmap.js?v={{$.AssetVersion}}";
  showHeatmap();
</script>
{{end}}{{end}}
