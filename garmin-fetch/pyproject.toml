[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "garmin-fetch"
version = "0.0.1"
description = "Fetch original FIT files from Garmin Connect for my Velo"
readme = "README.md"
requires-python = ">=3.12"
