# This code has been fully generated by an AI.
#
# Add-on manifest, see https://developers.home-assistant.io/docs/add-ons/configuration
# The version must match the Git tag (vX.Y.Z) that built the image; CI checks this.
name: my Velo
version: "0.2.0"
slug: my_velo
description: Rad- und Sportaktivitäten mit Karte, Statistik und Heatmap – lokal aus Garmin-FIT-Dateien
url: https://github.com/stefanluchs/my-velo
arch:
  - aarch64
  - amd64
image: ghcr.io/stefanluchs/my-velo-{arch}
init: false
startup: application
boot: auto

ingress: true
ingress_port: 8099
panel_icon: mdi:bike
panel_title: my Velo

# /share/myvelo/import is the drop folder for Garmin bulk exports.
map:
  - type: share
    read_only: false

# SQLite in WAL mode is only guaranteed consistent when no writer is active,
# so the add-on is stopped for the few seconds of a backup.
backup: cold
backup_exclude:
  - tmp

options:
  log_level: info
  map_provider: osm
  maptiler_key: ""
schema:
  log_level: list(debug|info|warning|error)
  map_provider: list(osm|maptiler)
  maptiler_key: password?
